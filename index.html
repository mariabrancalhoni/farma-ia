<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farma IA</title><style>body{margin:0;background:#f5f1fc;color:#302443;font:16px system-ui}header{padding:28px;background:linear-gradient(120deg,#6342a0,#aa8ae5);color:white}h1{margin:0}main{max-width:850px;margin:auto;padding:18px}nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:white}button{background:#7953b5;color:white;border:0;border-radius:10px;padding:12px;font:inherit;cursor:pointer}section{background:white;border-radius:16px;padding:18px;margin:12px 0}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #d8c9ef;border-radius:8px;margin:6px 0;font:inherit}textarea{min-height:140px}canvas{width:100%;height:400px;border:1px solid #d8c9ef;touch-action:none;background:white}small{color:#74658b}article{border-bottom:1px solid #eee;padding:12px 0;white-space:pre-wrap}iframe{width:100%;height:500px;border:0}</style><header><small style="color:white">SEU ESPAÇO ACADÊMICO</small><h1>Farma IA 💜</h1>Farmácia · Agenda e cadernos</header><nav id="nav"></nav><main id="main"></main><script>const m=document.querySelector('main');let db={notes:[],events:[],tasks:[]};try{db=JSON.parse(localStorage.getItem('farma-v1'))||db}catch{};function save(){try{localStorage.setItem('farma-v1',JSON.stringify(db))}catch{alert('O navegador não permitiu salvar os dados.')}}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pages=['Início','Agenda','Cadernos','Escrita','Slides','Tarefas','Notas','IA'];nav.innerHTML=pages.map(p=>`<button onclick="show('${p}')">${p}</button>`).join('');function show(p){m.innerHTML='<h2>'+p+'</h2>';if(p==='Início'){m.innerHTML+=`<section><h2>Seu painel</h2>${db.events.length} compromissos · ${db.notes.length} anotações · ${db.tasks.filter(t=>!t.done).length} tarefas pendentes</section><section>Versão local gratuita. Seus dados ficam neste navegador, quando o armazenamento é permitido. Sem sincronização ou notificações externas.</section>`}if(p==='Agenda'){m.innerHTML+=`<section><input id="title" placeholder="Prova ou atividade"><input id="date" type="date"><button onclick="addEvent()">Adicionar</button><p><small>Importar calendário Blackboard (.ics salvo no aparelho)</small></p><input type="file" accept=".ics,text/calendar" onchange="importICS(this.files[0])"></section>`+db.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<section>${esc(e.date)} — ${esc(e.title)} <button onclick="remove('events',${db.events.indexOf(e)},'Agenda')">Excluir</button></section>`).join('')}if(p==='Cadernos'){m.innerHTML+=`<section><input id="title" placeholder="Título"><input id="subject" placeholder="Disciplina"><textarea id="body" placeholder="Suas anotações"></textarea><button onclick="note()">Salvar</button></section>`+db.notes.map((n,i)=>`<section><b>${esc(n.title)}</b><p>${esc(n.subject)}</p><article>${esc(n.body)}</article><button onclick="edit(${i})">Editar</button> <button onclick="remove('notes',${i},'Cadernos')">Excluir</button></section>`).join('');window.editing=-1}if(p==='Tarefas'){m.innerHTML+=`<section><input id="title" placeholder="Nova tarefa"><button onclick="if(title.value.trim()){db.tasks.push({title:title.value,done:false});save();show('Tarefas')}">Adicionar</button></section>`+db.tasks.map((t,i)=>`<article><label><input style="width:auto" type="checkbox" ${t.done?'checked':''} onchange="db.tasks[${i}].done=this.checked;save()"> ${esc(t.title)}</label> <button onclick="remove('tasks',${i},'Tarefas')">Excluir</button></article>`).join('')}if(p==='Notas')m.innerHTML+=`<section>Pontos obtidos<input id="got" type="number" min="0">Meta<input id="goal" type="number" value="6"><button onclick="out.textContent='Faltam '+Math.max(0,+goal.value- +got.value).toFixed(2)+' pontos'">Calcular</button><p id="out"></p></section>`;if(p==='IA')m.innerHTML+=`<section><textarea id="prompt" placeholder="Conteúdo para resumir ou explicar"></textarea><button onclick="location.href='https://chatgpt.com/?q='+encodeURIComponent('Explique ou resuma para meus estudos de Farmácia: '+prompt.value)">Abrir ChatGPT</button><p>Abre o ChatGPT separadamente; não há IA embutida.</p></section>`;if(p==='Slides')m.innerHTML+=`<section><input type="file" accept="application/pdf,image/*" onchange="if(this.files[0])document.getElementById('preview').src=URL.createObjectURL(this.files[0])"><iframe id="preview" title="Material"></iframe><small>Visualização depende do navegador. Ainda não permite escrever sobre o PDF.</small></section>`;if(p==='Escrita'){m.innerHTML+=`<section><input id="ink" type="color" value="#7953b5"><button id="clear">Limpar</button> <button id="download">Salvar desenho PNG</button><canvas id="paper" width="1000" height="800"></canvas></section>`;let c=document.querySelector('canvas'),x=c.getContext('2d'),down=false;function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pos(e))};c.onpointermove=e=>{if(down){x.strokeStyle=ink.value;x.lineWidth=4;x.lineCap='round';x.lineTo(...pos(e));x.stroke()}};c.onpointerup=c.onpointercancel=()=>down=false;clear.onclick=()=>x.clearRect(0,0,c.width,c.height);download.onclick=()=>{let a=document.createElement('a');a.href=c.toDataURL();a.download='anotacao.png';a.click()}}}function remove(k,i,p){db[k].splice(i,1);save();show(p)}function addEvent(){if(title.value.trim()&&date.value){db.events.push({title:title.value,date:date.value});save();show('Agenda')}}function note(){let n={title:title.value||'Sem título',subject:subject.value,body:body.value};if(window.editing>=0)db.notes[window.editing]=n;else db.notes.push(n);save();show('Cadernos')}function edit(i){let n=db.notes[i];title.value=n.title;subject.value=n.subject;body.value=n.body;window.editing=i;window.scrollTo(0,0)}async function importICS(f){if(!f)return;let s=(await f.text()).replace(/\r?\n[ \t]/g,'');let count=0;for(let b of s.split('BEGIN:VEVENT').slice(1)){let t=b.match(/^SUMMARY[^:]*:(.*)$/m),d=b.match(/^DTSTART[^:]*:(\d{4})(\d{2})(\d{2})/m);if(t&&d){let e={title:t[1].trim(),date:d[1]+'-'+d[2]+'-'+d[3]};if(!db.events.some(a=>a.title===e.title&&a.date===e.date)){db.events.push(e);count++}}}save();show('Agenda');alert(count+' compromissos importados. Horários e recorrências não são importados.')}show('Início');</script></html>
